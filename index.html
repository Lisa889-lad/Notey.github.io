<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LedgerPro Accounting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <style>
      :root {
        --bg: #f1f4f1;
        --panel: #ffffff;
        --text: #17212b;
        --muted: #667585;
        --border: #dde4e0;
        --primary: #0e7c66;
        --primary-soft: #e2f2ed;
        --sidebar: #12263a;
        --danger: #c0392b;
        --warning: #b8862b;
        --hover: #f5f8f6;
        --shadow: rgba(15, 23, 42, 0.12);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Public Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-variant-numeric: tabular-nums;
      }

      button, input, select {
        font: inherit;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 220px;
        background: var(--sidebar);
        color: #d9e3eb;
        padding: 18px 12px;
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand {
        padding: 4px 10px 16px;
        font-family: "Newsreader", serif;
        font-size: 24px;
        font-weight: 700;
        color: white;
      }

      .brand .accent {
        color: #4fd1b0;
        font-style: normal;
      }

      .brand small {
        display: block;
        margin-top: 4px;
        font-family: "Public Sans", sans-serif;
        font-size: 12px;
        font-weight: 400;
        color: #8fa3b5;
      }

      .nav-button {
        background: transparent;
        border: 0;
        color: inherit;
        font: inherit;
        text-align: left;
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .nav-button:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      .nav-button.active {
        background: rgba(255, 255, 255, 0.08);
        color: white;
        box-shadow: inset 3px 0 0 #4fd1b0;
      }

      .sidebar-footer {
        margin-top: auto;
        padding: 8px 12px;
        font-size: 12px;
        color: #8fa3b5;
      }

      .main {
        flex: 1;
        min-width: 0;
        padding: 26px 30px;
        max-width: 1300px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      h1, h2, h3 {
        margin: 0;
        font-family: "Newsreader", serif;
        font-weight: 600;
      }

      h1 { font-size: 30px; }
      h3 { font-size: 20px; }

      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .toolbar input,
      .toolbar select,
      .field input,
      .field select {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        min-height: 38px;
      }

      .button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.15s ease;
      }

      .button:hover { background: var(--hover); }
      .button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }
      .button.primary:hover { filter: brightness(1.06); }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 14px;
      }
      .card-inner { padding: 16px 18px; }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .stat {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .stat span {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
      }
      .stat strong {
        display: block;
        margin-top: 4px;
        font-weight: 600;
        font-size: 28px;
        font-family: "Newsreader", serif;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead th {
        text-align: left;
        font-size: 12.5px;
        color: var(--muted);
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--hover);
      }
      tbody td {
        padding: 9px 14px;
        border-bottom: 1px solid var(--border);
      }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover td { background: var(--hover); }
      .text-right { text-align: right; }
      .text-center { text-align: center; }

      .badge {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: var(--primary-soft);
        color: var(--primary);
      }
      .badge.overdue {
        background: rgba(192, 57, 43, 0.12);
        color: var(--danger);
      }
      .badge.partial {
        background: rgba(184, 134, 43, 0.12);
        color: var(--warning);
      }
      .badge.void,
      .badge.reversal,
      .badge.inactive {
        background: rgba(102, 117, 133, 0.12);
        color: var(--muted);
      }
      .badge.paid,
      .badge.open {
        background: rgba(88, 122, 255, 0.12);
        color: #3b78c4;
      }

      .link-button {
        background: transparent;
        border: 0;
        padding: 2px 6px;
        color: var(--primary);
        cursor: pointer;
        font-weight: 600;
      }
      .link-button:hover { text-decoration: underline; }
      .link-button.danger { color: var(--danger); }

      .field {
        display: block;
        margin-bottom: 12px;
      }
      .field label {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .field input,
      .field select {
        width: 100%;
        display: block;
      }

      .grid-two {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0 12px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 17, 24, 0.55);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 6vh 12px 30px;
        overflow: auto;
        z-index: 100;
      }
      .modal-card {
        width: min(680px, 100%);
        background: var(--panel);
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 15px 35px var(--shadow);
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--sidebar);
        color: white;
        padding: 10px 18px;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }
      .toast.show { opacity: 1; }

      .empty {
        text-align: center;
        padding: 28px;
        color: var(--muted);
      }

      .muted { color: var(--muted); }
      .success { color: var(--primary); }
      .danger { color: var(--danger); }

      @media (max-width: 820px) {
        .app { flex-direction: column; }
        .sidebar {
          position: static;
          width: auto;
          height: auto;
          flex-direction: row;
          overflow-x: auto;
          padding: 8px;
        }
        .brand, .sidebar-footer { display: none; }
        .main { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="main" class="main"></main>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast"></div>

    <script>
      const APP_KEY = 'ledgerpro_v1';
      const DEFAULT_TYPES = ['Asset', 'Liability', 'Equity', 'Income', 'Expense'];
      const SYSTEM_CODES = [1000, 1100, 1200, 1500, 2000, 2100, 3000, 4000, 5000, 6000];

      const $ = (selector) => document.querySelector(selector);

      const todayIso = () => new Date().toISOString().slice(0, 10);
      const addDays = (dateStr, days) => {
        const d = new Date(dateStr + 'T12:00:00');
        d.setDate(d.getDate() + days);
        return d.toISOString().slice(0, 10);
      };
      const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      const round2 = (value) => Math.round((value + Number.EPSILON) * 100) / 100;

      const escapeHtml = (value = '') => String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      const money = (value, symbol = '$') => {
        const amount = Math.abs(value);
        const formatted = amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return `${value < 0 ? '-' : ''}${symbol}${formatted}`;
      };

      const defaultState = () => ({
        company: {
          name: 'My Company Ltd',
          currencySymbol: '$',
          taxRate: 10,
          role: 'Admin',
          invNumber: 1001,
          billNumber: 1,
          jnNumber: 0,
          lockThrough: ''
        },
        accounts: [
          { id: uid(), code: 1000, name: 'Cash at Bank', type: 'Asset', active: true },
          { id: uid(), code: 1100, name: 'Accounts Receivable', type: 'Asset', active: true },
          { id: uid(), code: 1200, name: 'Inventory', type: 'Asset', active: true },
          { id: uid(), code: 1500, name: 'Equipment', type: 'Asset', active: true },
          { id: uid(), code: 2000, name: 'Accounts Payable', type: 'Liability', active: true },
          { id: uid(), code: 2100, name: 'Sales Tax Payable', type: 'Liability', active: true },
          { id: uid(), code: 3000, name: 'Owner Capital', type: 'Equity', active: true },
          { id: uid(), code: 4000, name: 'Sales Revenue', type: 'Income', active: true },
          { id: uid(), code: 5000, name: 'Office Expenses', type: 'Expense', active: true },
          { id: uid(), code: 6000, name: 'Rent Expense', type: 'Expense', active: true }
        ],
        entries: [],
        docs: [],
        logs: []
      });

      function loadState() {
        try {
          const raw = localStorage.getItem(APP_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.accounts) || !parsed.company) return defaultState();
          return parsed;
        } catch (error) {
          return defaultState();
        }
      }

      let state = loadState();
      let currentView = 'dashboard';
      let currentReport = 'trial-balance';
      let searchQuery = '';
      let modalState = null;
      let toastTimer = null;

      function saveState() {
        try {
          localStorage.setItem(APP_KEY, JSON.stringify(state));
        } catch (error) {
          console.warn('Unable to save app data.', error);
        }
      }

      function showToast(message) {
        const toast = $('#toast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
      }

      function adminOnly() {
        if (state.company.role !== 'Admin') {
          showToast('This action needs the Admin role');
          return false;
        }
        return true;
      }

      function viewerOnly() {
        return state.company.role !== 'Viewer';
      }

      function accountById(id) {
        return state.accounts.find((account) => account.id === id) || null;
      }

      function findAccountByCode(code) {
        return state.accounts.find((account) => Number(account.code) === Number(code)) || null;
      }

      function sortedAccounts() {
        return [...state.accounts].sort((a, b) => Number(a.code) - Number(b.code));
      }

      function sumEntryLines(entry) {
        let debit = 0;
        let credit = 0;
        for (const line of entry.lines || []) {
          debit += Number(line.debit || 0);
          credit += Number(line.credit || 0);
        }
        return { debit: round2(debit), credit: round2(credit) };
      }

      function balanceForAccount(accountId, fromDate = '', toDate = '') {
        let debit = 0;
        let credit = 0;

        for (const entry of state.entries) {
          if (fromDate && entry.date < fromDate) continue;
          if (toDate && entry.date > toDate) continue;
          for (const line of entry.lines || []) {
            if (line.accountId !== accountId) continue;
            debit += Number(line.debit || 0);
            credit += Number(line.credit || 0);
          }
        }

        const account = accountById(accountId);
        if (!account) return 0;
        if (account.type === 'Asset' || account.type === 'Expense') {
          return round2(debit - credit);
        }
        return round2(credit - debit);
      }

      function accountTypeBalance(type, fromDate = '', toDate = '') {
        let total = 0;
        for (const account of sortedAccounts()) {
          if (account.type !== type || !account.active) continue;
          total += balanceForAccount(account.id, fromDate, toDate);
        }
        return round2(total);
      }

      function postEntry(date, ref, memo, lines, source = 'manual') {
        if (state.company.lockThrough && date <= state.company.lockThrough) {
          showToast('Books are locked through ' + state.company.lockThrough);
          return null;
        }

        const totalDebit = lines.reduce((sum, line) => sum + Number(line.debit || 0), 0);
        const totalCredit = lines.reduce((sum, line) => sum + Number(line.credit || 0), 0);

        if (totalDebit !== totalCredit || totalDebit === 0) {
          showToast('Debits and credits must match and not be zero.');
          return null;
        }

        const entry = {
          id: uid(),
          ref: ref || `JE-${String(state.company.jnNumber + 1).padStart(4, '0')}`,
          date,
          memo,
          source,
          lines: lines.map((line) => ({
            accountId: line.accountId,
            debit: round2(Number(line.debit || 0)),
            credit: round2(Number(line.credit || 0))
          }))
        };

        state.entries.push(entry);
        state.company.jnNumber = Math.max(state.company.jnNumber, Number(entry.ref.replace(/\D/g, '')) || 0);
        state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Posted ${entry.ref}` });
        saveState();
        return entry;
      }

      function reverseEntry(entryId) {
        const entry = state.entries.find((item) => item.id === entryId);
        if (!entry) return;
        if (state.company.lockThrough && entry.date <= state.company.lockThrough) {
          showToast('This period is locked.');
          return;
        }

        const reversed = {
          id: uid(),
          ref: `REV-${entry.ref}`,
          date: todayIso(),
          memo: `Reversal of ${entry.ref}`,
          source: 'reversal',
          lines: entry.lines.map((line) => ({
            accountId: line.accountId,
            debit: round2(Number(line.credit || 0)),
            credit: round2(Number(line.debit || 0))
          }))
        };

        state.entries.push(reversed);
        state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Reversed ${entry.ref}` });
        saveState();
        return reversed;
      }

      function documentStatus(doc) {
        if (doc.voided) return 'Void';
        if (doc.total <= doc.paid + 0.005) return 'Paid';
        if (doc.dueDate < todayIso()) return 'Overdue';
        if (doc.paid > 0) return 'Partial';
        return 'Open';
      }

      function addDemoData() {
        if (!adminOnly()) return;

        const cash = findAccountByCode(1000);
        const cap = findAccountByCode(3000);
        const sales = findAccountByCode(4000);
        const expense = findAccountByCode(5000);
        const rent = findAccountByCode(6000);

        if (!cash || !cap || !sales || !expense || !rent) return;

        const opening = postEntry(
          addDays(todayIso(), -60),
          'OPEN-1',
          'Opening capital',
          [
            { accountId: cash.id, debit: 30000, credit: 0 },
            { accountId: cap.id, debit: 0, credit: 30000 }
          ],
          'opening'
        );

        if (!opening) return;

        postEntry(
          addDays(todayIso(), -30),
          'INV-1001',
          'Website design',
          [
            { accountId: findAccountByCode(1100).id, debit: 0, credit: 3200 },
            { accountId: sales.id, debit: 3200, credit: 0 }
          ],
          'invoice'
        );

        postEntry(
          addDays(todayIso(), -18),
          'BILL-0001',
          'Office rent',
          [
            { accountId: rent.id, debit: 1200, credit: 0 },
            { accountId: findAccountByCode(2000).id, debit: 0, credit: 1200 }
          ],
          'bill'
        );

        state.logs.unshift({ time: new Date().toISOString(), user: 'Admin', action: 'Sample data loaded' });
        saveState();
        render();
      }

      function renderSidebar() {
        const buttons = [
          ['dashboard', '📊', 'Dashboard'],
          ['sales', '🧾', 'Sales'],
          ['purchases', '🛒', 'Purchases'],
          ['journal', '📒', 'Journal'],
          ['accounts', '🗂️', 'Accounts'],
          ['reports', '📈', 'Reports'],
          ['settings', '⚙️', 'Settings']
        ];

        const html = `
          <div class="brand">Ledger<span class="accent">Pro</span><small>${escapeHtml(state.company.name)}</small></div>
          ${buttons.map(([id, icon, label]) => `
            <button class="nav-button ${currentView === id ? 'active' : ''}" data-nav="${id}">
              <span>${icon}</span>
              <span>${label}</span>
            </button>
          `).join('')}
          <div class="sidebar-footer">${escapeHtml(state.company.role)}</div>
        `;
        $('#sidebar').innerHTML = html;
      }

      function renderMain() {
        const pages = {
          dashboard: renderDashboard,
          sales: renderSales,
          purchases: renderPurchases,
          journal: renderJournal,
          accounts: renderAccounts,
          reports: renderReports,
          settings: renderSettings
        };

        const view = pages[currentView] ? pages[currentView]() : pages.dashboard();
        $('#main').innerHTML = view;
      }

      function renderDashboard() {
        const yearStart = `${todayIso().slice(0, 4)}-01-01`;
        const cash = accountTypeBalance('Asset', '', todayIso()) - accountTypeBalance('Liability', '', todayIso());
        const receivables = balanceForAccount(findAccountByCode(1100)?.id || '', '', todayIso());
        const payables = Math.abs(balanceForAccount(findAccountByCode(2000)?.id || '', '', todayIso()));

        const months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date();
          d.setDate(1);
          d.setMonth(d.getMonth() - i);
          months.push(d.toISOString().slice(0, 7));
        }

        const incomeSeries = months.map((month) => {
          let total = 0;
          for (const entry of state.entries) {
            if (!entry.date.startsWith(month)) continue;
            for (const line of entry.lines) {
              const account = accountById(line.accountId);
              if (account && account.type === 'Income') total += Number(line.credit || 0) - Number(line.debit || 0);
            }
          }
          return total;
        });

        const expenseSeries = months.map((month) => {
          let total = 0;
          for (const entry of state.entries) {
            if (!entry.date.startsWith(month)) continue;
            for (const line of entry.lines) {
              const account = accountById(line.accountId);
              if (account && account.type === 'Expense') total += Number(line.debit || 0) - Number(line.credit || 0);
            }
          }
          return total;
        });

        const maxValue = Math.max(1, ...incomeSeries.concat(expenseSeries));
        const chartBars = months.map((month, index) => {
          const x = 40 + index * 82;
          const incomeH = (incomeSeries[index] / maxValue) * 120;
          const expenseH = (expenseSeries[index] / maxValue) * 120;
          return `
            <rect x="${x}" y="${155 - incomeH}" width="24" height="${incomeH}" fill="var(--primary)" rx="4"></rect>
            <rect x="${x + 30}" y="${155 - expenseH}" width="24" height="${expenseH}" fill="#a7d8c6" rx="4"></rect>
            <text x="${x + 18}" y="170" fill="var(--muted)" font-size="10" text-anchor="middle">${month.slice(5)}</text>
          `;
        }).join('');

        const recentEntries = [...state.entries].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
        const recentTable = recentEntries.length
          ? `<table><thead><tr><th>No</th><th>Date</th><th>Memo</th><th class="text-right">Amount</th></tr></thead><tbody>${recentEntries.map((entry) => {
              const amount = Math.max(...entry.lines.map((line) => Number(line.debit || line.credit || 0)), 0);
              return `<tr><td>${escapeHtml(entry.ref)}</td><td>${escapeHtml(entry.date)}</td><td>${escapeHtml(entry.memo || '')}</td><td class="text-right">${escapeHtml(money(amount, state.company.currencySymbol))}</td></tr>`;
            }).join('')}</tbody></table>`
          : '<div class="empty">No entries yet.</div>';

        return `
          <div class="topbar">
            <h1>Dashboard</h1>
            <div class="toolbar">
              <button class="button" onclick="openDocumentForm('bill')">New bill</button>
              <button class="button" onclick="openJournalForm()">New journal entry</button>
              <button class="button primary" onclick="openDocumentForm('invoice')">New invoice</button>
            </div>
          </div>

          ${state.entries.length === 0 ? `
            <div class="card">
              <div class="card-inner">
                <h3>Welcome to LedgerPro</h3>
                <p class="muted">Your books are empty. Update settings, review accounts, and add your first invoice.</p>
              </div>
            </div>
          ` : ''}

          <div class="stats-grid">
            <div class="stat"><span>Cash at bank</span><strong>${money(cash, state.company.currencySymbol)}</strong></div>
            <div class="stat"><span>Receivables</span><strong>${money(receivables, state.company.currencySymbol)}</strong></div>
            <div class="stat"><span>Payables</span><strong>${money(payables, state.company.currencySymbol)}</strong></div>
            <div class="stat"><span>Net income</span><strong>${money(accountTypeBalance('Income', yearStart, todayIso()) - accountTypeBalance('Expense', yearStart, todayIso()), state.company.currencySymbol)}</strong></div>
          </div>

          <div class="card">
            <div class="card-inner">
              <h3>Income and expenses, last six months</h3>
              <svg viewBox="0 0 560 180" width="100%" height="180" aria-label="Monthly income and expense chart">
                <line x1="20" x2="540" y1="155" y2="155" stroke="var(--border)"/>
                <line x1="20" y1="20" x2="20" y2="155" stroke="var(--border)"/>
                ${chartBars}
              </svg>
            </div>
          </div>

          <div class="card">
            <div class="card-inner">
              <h3>Recent entries</h3>
              ${recentTable}
            </div>
          </div>
        `;
      }

      function renderSales() {
        return renderDocumentTable('invoice', 'Sales');
      }

      function renderPurchases() {
        return renderDocumentTable('bill', 'Purchases');
      }

      function renderDocumentTable(type, title) {
        const docs = state.docs.filter((doc) => doc.type === type).sort((a, b) => b.date.localeCompare(a.date));
        const filtered = docs.filter((doc) => {
          if (!searchQuery) return true;
          const haystack = `${doc.no} ${doc.contact} ${doc.description}`.toLowerCase();
          return haystack.includes(searchQuery.toLowerCase());
        });

        const rows = filtered.length
          ? filtered.map((doc) => {
              const balance = round2(doc.total - doc.paid);
              const badgeClass = documentStatus(doc).toLowerCase().replace(/\s/g, '');
              return `
                <tr>
                  <td>${escapeHtml(doc.no)}</td>
                  <td>${escapeHtml(doc.date)}</td>
                  <td>${escapeHtml(doc.contact)}</td>
                  <td>${escapeHtml(doc.description)}</td>
                  <td class="text-right">${escapeHtml(money(doc.total, state.company.currencySymbol))}</td>
                  <td class="text-right">${escapeHtml(money(balance, state.company.currencySymbol))}</td>
                  <td><span class="badge ${badgeClass}">${escapeHtml(documentStatus(doc))}</span></td>
                  <td class="text-right">
                    <button class="link-button" onclick="openDocumentForm('${type}', '${doc.id}')">Edit</button>
                    <button class="link-button danger" onclick="voidDocument('${doc.id}')">Void</button>
                  </td>
                </tr>
              `;
            }).join('')
          : '<tr><td colspan="8" class="empty">No records found.</td></tr>';

        return `
          <div class="topbar">
            <h1>${title}</h1>
            <div class="toolbar">
              <input type="search" value="${escapeHtml(searchQuery)}" placeholder="Search…" oninput="searchQuery = this.value; render();" />
              <button class="button" onclick="exportTable('${type}')">Excel</button>
              <button class="button primary" onclick="openDocumentForm('${type}')">New ${title === 'Sales' ? 'invoice' : 'bill'}</button>
            </div>
          </div>
          <div class="card">
            <div class="card-inner">
              <table>
                <thead>
                  <tr>
                    <th>No</th>
                    <th>Date</th>
                    <th>Contact</th>
                    <th>Description</th>
                    <th class="text-right">Total</th>
                    <th class="text-right">Balance</th>
                    <th>Status</th>
                    <th class="text-right">Actions</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderJournal() {
        const entries = [...state.entries].sort((a, b) => b.date.localeCompare(a.date));
        const filtered = entries.filter((entry) => {
          if (!searchQuery) return true;
          return `${entry.ref} ${entry.memo}`.toLowerCase().includes(searchQuery.toLowerCase());
        });

        const rows = filtered.length
          ? filtered.map((entry) => {
              const amount = entry.lines.reduce((sum, line) => sum + Number(line.debit || 0), 0);
              return `
                <tr>
                  <td>${escapeHtml(entry.ref)}</td>
                  <td>${escapeHtml(entry.date)}</td>
                  <td>${escapeHtml(entry.memo || '')}</td>
                  <td class="text-right">${escapeHtml(money(amount, state.company.currencySymbol))}</td>
                  <td><span class="badge">${escapeHtml(entry.source)}</span></td>
                  <td class="text-right">
                    <button class="link-button" onclick="openJournalForm('${entry.id}')">Edit</button>
                    <button class="link-button danger" onclick="voidJournalEntry('${entry.id}')">Void</button>
                  </td>
                </tr>
              `;
            }).join('')
          : '<tr><td colspan="6" class="empty">No journal entries found.</td></tr>';

        return `
          <div class="topbar">
            <h1>Journal</h1>
            <div class="toolbar">
              <input type="search" value="${escapeHtml(searchQuery)}" placeholder="Search…" oninput="searchQuery = this.value; render();" />
              <button class="button" onclick="importExcel()">Import Excel</button>
              <button class="button primary" onclick="openJournalForm()">New journal entry</button>
            </div>
          </div>
          <div class="card">
            <div class="card-inner">
              <table>
                <thead>
                  <tr>
                    <th>No</th>
                    <th>Date</th>
                    <th>Memo</th>
                    <th class="text-right">Amount</th>
                    <th>Source</th>
                    <th class="text-right">Actions</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderAccounts() {
        const accounts = sortedAccounts();
        const rows = accounts.map((account) => {
          const balance = balanceForAccount(account.id);
          return `
            <tr>
              <td>${escapeHtml(account.code)}</td>
              <td>${escapeHtml(account.name)}</td>
              <td>${escapeHtml(account.type)}</td>
              <td class="text-right">${escapeHtml(money(balance, state.company.currencySymbol))}</td>
              <td><span class="badge ${account.active ? 'paid' : 'inactive'}">${account.active ? 'Active' : 'Inactive'}</span></td>
              <td class="text-right">
                <button class="link-button" onclick="openAccountForm('${account.id}')">Edit</button>
                <button class="link-button danger" onclick="deleteAccount('${account.id}')">Delete</button>
              </td>
            </tr>
          `;
        }).join('');

        return `
          <div class="topbar">
            <h1>Chart of Accounts</h1>
            <div class="toolbar">
              <input type="search" value="${escapeHtml(searchQuery)}" placeholder="Search…" oninput="searchQuery = this.value; render();" />
              <button class="button primary" onclick="openAccountForm()">New account</button>
            </div>
          </div>
          <div class="card">
            <div class="card-inner">
              <table>
                <thead>
                  <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th class="text-right">Balance</th>
                    <th>Status</th>
                    <th class="text-right">Actions</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderReports() {
        const trial = trialBalance();
        const incomeTotal = accountTypeBalance('Income', '', todayIso());
        const expenseTotal = accountTypeBalance('Expense', '', todayIso());
        const net = round2(incomeTotal - expenseTotal);

        const reportTable = {
          'trial-balance': trial,
          'profit-loss': profitLossReport(),
          'balance-sheet': balanceSheetReport()
        }[currentReport] || trial;

        return `
          <div class="topbar">
            <h1>Reports</h1>
            <div class="toolbar">
              <select onchange="currentReport = this.value; render();">
                <option value="trial-balance" ${currentReport === 'trial-balance' ? 'selected' : ''}>Trial balance</option>
                <option value="profit-loss" ${currentReport === 'profit-loss' ? 'selected' : ''}>Profit & loss</option>
                <option value="balance-sheet" ${currentReport === 'balance-sheet' ? 'selected' : ''}>Balance sheet</option>
              </select>
              <button class="button" onclick="exportReport()">Excel</button>
            </div>
          </div>
          <div class="card">
            <div class="card-inner">
              ${reportTable}
            </div>
          </div>
        `;
      }

      function trialBalance() {
        const rows = sortedAccounts().filter((account) => account.active).map((account) => {
          const balance = balanceForAccount(account.id);
          return `<tr><td>${escapeHtml(account.code)}</td><td>${escapeHtml(account.name)}</td><td>${escapeHtml(account.type)}</td><td class="text-right">${escapeHtml(money(balance, state.company.currencySymbol))}</td></tr>`;
        }).join('');

        return `
          <h3>Trial balance</h3>
          <table>
            <thead><tr><th>Code</th><th>Name</th><th>Type</th><th class="text-right">Balance</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function profitLossReport() {
        const income = accountTypeBalance('Income');
        const expense = accountTypeBalance('Expense');
        const net = round2(income - expense);

        return `
          <h3>Profit and loss</h3>
          <table>
            <tbody>
              <tr><td>Income</td><td class="text-right">${escapeHtml(money(income, state.company.currencySymbol))}</td></tr>
              <tr><td>Expense</td><td class="text-right">${escapeHtml(money(expense, state.company.currencySymbol))}</td></tr>
              <tr><td><strong>Net income</strong></td><td class="text-right"><strong>${escapeHtml(money(net, state.company.currencySymbol))}</strong></td></tr>
            </tbody>
          </table>
        `;
      }

      function balanceSheetReport() {
        const assets = accountTypeBalance('Asset');
        const liabilities = accountTypeBalance('Liability');
        const equity = accountTypeBalance('Equity');
        const net = round2(assets - liabilities - equity);

        return `
          <h3>Balance sheet</h3>
          <table>
            <tbody>
              <tr><td>Assets</td><td class="text-right">${escapeHtml(money(assets, state.company.currencySymbol))}</td></tr>
              <tr><td>Liabilities</td><td class="text-right">${escapeHtml(money(liabilities, state.company.currencySymbol))}</td></tr>
              <tr><td>Equity</td><td class="text-right">${escapeHtml(money(equity, state.company.currencySymbol))}</td></tr>
              <tr><td><strong>Net</strong></td><td class="text-right"><strong>${escapeHtml(money(net, state.company.currencySymbol))}</strong></td></tr>
            </tbody>
          </table>
        `;
      }

      function renderSettings() {
        const logRows = state.logs.slice(0, 20).map((entry) => `
          <tr>
            <td>${escapeHtml(new Date(entry.time).toLocaleString())}</td>
            <td>${escapeHtml(entry.user)}</td>
            <td>${escapeHtml(entry.action)}</td>
          </tr>
        `).join('');

        return `
          <div class="topbar">
            <h1>Settings</h1>
          </div>

          <div class="card">
            <div class="card-inner">
              <h3>Company</h3>
              <div class="grid-two">
                <div class="field"><label>Company name</label><input id="company-name" value="${escapeHtml(state.company.name)}" /></div>
                <div class="field"><label>Currency symbol</label><input id="currency-symbol" maxlength="4" value="${escapeHtml(state.company.currencySymbol)}" /></div>
                <div class="field"><label>Tax rate (%)</label><input id="tax-rate" type="number" min="0" max="100" value="${escapeHtml(state.company.taxRate)}" /></div>
                <div class="field"><label>Role</label><select id="role-select">
                  <option value="Admin" ${state.company.role === 'Admin' ? 'selected' : ''}>Admin</option>
                  <option value="Accountant" ${state.company.role === 'Accountant' ? 'selected' : ''}>Accountant</option>
                  <option value="Viewer" ${state.company.role === 'Viewer' ? 'selected' : ''}>Viewer</option>
                </select></div>
              </div>
              <div class="modal-actions">
                <button class="button" onclick="saveSettings()">Save settings</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-inner">
              <h3>Data</h3>
              <div class="toolbar">
                <button class="button" onclick="exportAllData()">Export all data</button>
                <button class="button" onclick="backupJson()">Back up</button>
                <button class="button" onclick="addDemoData()">Load demo data</button>
                <button class="button danger" onclick="wipeData()">Wipe all</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-inner">
              <h3>Audit trail</h3>
              <table>
                <thead><tr><th>When</th><th>Role</th><th>Action</th></tr></thead>
                <tbody>${logRows || '<tr><td colspan="3" class="empty">No recent activity.</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      function saveSettings() {
        if (!adminOnly()) return;

        const companyName = $('#company-name').value.trim();
        const currencySymbol = $('#currency-symbol').value.trim() || '$';
        const taxRate = Number($('#tax-rate').value || 0);
        const role = $('#role-select').value;

        if (!companyName || taxRate < 0 || taxRate > 100) {
          showToast('Enter a valid company name and tax rate.');
          return;
        }

        state.company.name = companyName;
        state.company.currencySymbol = currencySymbol;
        state.company.taxRate = round2(taxRate);
        state.company.role = role;
        state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: 'Updated company settings' });
        saveState();
        render();
      }

      function openAccountForm(accountId = '') {
        if (!adminOnly()) return;
        const account = accountId ? accountById(accountId) : null;
        modalState = {
          type: 'account',
          accountId,
          title: account ? 'Edit account' : 'New account'
        };

        const html = `
          <div class="grid-two">
            <div class="field">
              <label>Code</label>
              <input id="account-code" type="number" value="${account ? account.code : ''}" ${account && SYSTEM_CODES.includes(Number(account.code)) ? 'disabled' : ''} />
            </div>
            <div class="field">
              <label>Type</label>
              <select id="account-type">
                ${DEFAULT_TYPES.map((type) => `<option value="${type}" ${account && account.type === type ? 'selected' : ''}>${type}</option>`).join('')}
              </select>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <label>Name</label>
              <input id="account-name" value="${account ? escapeHtml(account.name) : ''}" />
            </div>
          </div>
        `;

        renderModal(modalState.title, html, [
          { label: 'Cancel', className: 'button', action: 'closeModal' },
          { label: account ? 'Save changes' : 'Create', className: 'button primary', action: 'saveAccount' }
        ]);
      }

      function saveAccount() {
        const code = Number($('#account-code')?.value || 0);
        const name = $('#account-name')?.value.trim();
        const type = $('#account-type')?.value;
        const account = modalState && modalState.accountId ? accountById(modalState.accountId) : null;

        if (!code || !name || !type) {
          showToast('Enter a valid code and account name.');
          return;
        }

        const duplicate = state.accounts.some((item) => item.code === code && (!account || item.id !== account.id));
        if (duplicate) {
          showToast('That account code already exists.');
          return;
        }

        if (account) {
          account.code = code;
          account.name = name;
          account.type = type;
          state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Edited account ${code}` });
        } else {
          state.accounts.push({ id: uid(), code, name, type, active: true });
          state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Added account ${code}` });
        }

        saveState();
        closeModal();
        render();
      }

      function deleteAccount(accountId) {
        if (!adminOnly()) return;
        const account = accountById(accountId);
        if (!account) return;
        if (state.entries.some((entry) => entry.lines.some((line) => line.accountId === accountId))) {
          showToast('This account has journal activity and cannot be deleted.');
          return;
        }
        state.accounts = state.accounts.filter((item) => item.id !== accountId);
        state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Deleted account ${account.code}` });
        saveState();
        render();
      }

      function openDocumentForm(type, documentId = '') {
        if (viewerOnly()) return;
        const kind = type === 'invoice' ? 'invoice' : 'bill';
        const document = documentId ? state.docs.find((item) => item.id === documentId) : null;

        const html = `
          <div class="grid-two">
            <div class="field"><label>${kind === 'invoice' ? 'Customer' : 'Vendor'}</label><input id="doc-contact" value="${document ? escapeHtml(document.contact) : ''}" /></div>
            <div class="field"><label>Account</label>
              <select id="doc-account">
                ${sortedAccounts().filter((account) => account.active && (kind === 'invoice' ? account.type === 'Income' : account.type === 'Expense')).map((account) => `<option value="${account.id}" ${document && document.accountId === account.id ? 'selected' : ''}>${account.code} ${escapeHtml(account.name)}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Date</label><input id="doc-date" type="date" value="${document ? document.date : todayIso()}" /></div>
            <div class="field"><label>Due date</label><input id="doc-due" type="date" value="${document ? document.dueDate : addDays(todayIso(), 14)}" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>Description</label><input id="doc-description" value="${document ? escapeHtml(document.description) : ''}" /></div>
            <div class="field"><label>Quantity</label><input id="doc-qty" type="number" min="0" step="0.01" value="${document ? document.qty : 1}" /></div>
            <div class="field"><label>Unit price</label><input id="doc-price" type="number" min="0" step="0.01" value="${document ? document.price : 0}" /></div>
            <div class="field"><label>Tax rate (%)</label><input id="doc-tax" type="number" min="0" max="100" step="0.01" value="${document ? document.taxRate : state.company.taxRate}" /></div>
          </div>
        `;

        modalState = { type: 'document', kind, documentId, title: document ? `Edit ${kind}` : `New ${kind}` };

        renderModal(modalState.title, html, [
          { label: 'Cancel', className: 'button', action: 'closeModal' },
          { label: document ? 'Save changes' : 'Create', className: 'button primary', action: 'saveDocument' }
        ]);
      }

      function saveDocument() {
        const kind = modalState.kind;
        const contact = $('#doc-contact').value.trim();
        const accountId = $('#doc-account').value;
        const date = $('#doc-date').value;
        const dueDate = $('#doc-due').value || date;
        const description = $('#doc-description').value.trim();
        const qty = Number($('#doc-qty').value || 0);
        const price = Number($('#doc-price').value || 0);
        const taxRate = Number($('#doc-tax').value || 0);

        if (!contact || !accountId || !date || qty <= 0 || price <= 0 || !description) {
          showToast('Please complete all required document fields.');
          return;
        }

        const net = round2(qty * price);
        const taxAmount = round2(net * (taxRate / 100));
        const total = round2(net + taxAmount);

        const docPayload = {
          id: modalState.documentId || uid(),
          type: kind,
          no: modalState.documentId ? state.docs.find((doc) => doc.id === modalState.documentId)?.no : (kind === 'invoice' ? `INV-${state.company.invNumber}` : `BILL-${String(state.company.billNumber).padStart(4, '0')}`),
          contact,
          accountId,
          date,
          dueDate,
          description,
          qty,
          price,
          taxRate,
          net,
          taxAmount,
          total,
          paid: modalState.documentId ? state.docs.find((doc) => doc.id === modalState.documentId)?.paid || 0 : 0,
          voided: false
        };

        if (modalState.documentId) {
          const existing = state.docs.find((doc) => doc.id === modalState.documentId);
          Object.assign(existing, docPayload);
          state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Updated ${existing.no}` });
        } else {
          state.docs.push(docPayload);
          if (kind === 'invoice') state.company.invNumber += 1;
          else state.company.billNumber += 1;
          state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Created ${docPayload.no}` });
        }

        saveState();
        closeModal();
        render();
      }

      function voidDocument(documentId) {
        if (!adminOnly()) return;
        const document = state.docs.find((item) => item.id === documentId);
        if (!document) return;
        document.voided = true;
        state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Voided ${document.no}` });
        saveState();
        render();
      }

      function openJournalForm(entryId = '') {
        if (viewerOnly()) return;
        const entry = entryId ? state.entries.find((item) => item.id === entryId) : null;
        const existingLines = entry?.lines || [
          { accountId: '', debit: 0, credit: 0 },
          { accountId: '', debit: 0, credit: 0 }
        ];

        modalState = { type: 'journal', entryId, title: entry ? 'Edit journal entry' : 'New journal entry' };

        const rows = existingLines.map((line, index) => `
          <tr>
            <td>
              <select data-line-account="${index}">
                <option value="">Select account</option>
                ${sortedAccounts().filter((account) => account.active).map((account) => `<option value="${account.id}" ${line.accountId === account.id ? 'selected' : ''}>${account.code} ${escapeHtml(account.name)}</option>`).join('')}
              </select>
            </td>
            <td><input data-line-debit="${index}" type="number" step="0.01" value="${line.debit || 0}" /></td>
            <td><input data-line-credit="${index}" type="number" step="0.01" value="${line.credit || 0}" /></td>
          </tr>
        `).join('');

        const html = `
          <div class="grid-two">
            <div class="field"><label>Date</label><input id="journal-date" type="date" value="${entry ? entry.date : todayIso()}" /></div>
            <div class="field"><label>Reference</label><input id="journal-ref" value="${entry ? escapeHtml(entry.ref) : ''}" /></div>
            <div class="field" style="grid-column: 1 / -1;"><label>Memo</label><input id="journal-memo" value="${entry ? escapeHtml(entry.memo || '') : ''}" /></div>
          </div>
          <table style="margin-top: 10px;">
            <thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;

        renderModal(modalState.title, html, [
          { label: 'Cancel', className: 'button', action: 'closeModal' },
          { label: entry ? 'Save changes' : 'Create', className: 'button primary', action: 'saveJournalEntry' }
        ]);
      }

      function saveJournalEntry() {
        const date = $('#journal-date').value;
        const ref = $('#journal-ref').value.trim();
        const memo = $('#journal-memo').value.trim();
        const rowCount = document.querySelectorAll('[data-line-account]').length;
        const lines = [];

        for (let index = 0; index < rowCount; index++) {
          const accountId = document.querySelector(`[data-line-account="${index}"]`)?.value;
          const debit = Number(document.querySelector(`[data-line-debit="${index}"]`)?.value || 0);
          const credit = Number(document.querySelector(`[data-line-credit="${index}"]`)?.value || 0);
          if (!accountId) continue;
          lines.push({ accountId, debit, credit });
        }

        if (!date || lines.length < 2) {
          showToast('Enter a date and at least two valid lines.');
          return;
        }

        if (modalState.entryId) {
          const existing = state.entries.find((item) => item.id === modalState.entryId);
          if (existing) {
            existing.date = date;
            existing.ref = ref || existing.ref;
            existing.memo = memo;
            existing.lines = lines;
            state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Updated ${existing.ref}` });
          }
        } else {
          postEntry(date, ref, memo, lines, 'manual');
        }

        saveState();
        closeModal();
        render();
      }

      function voidJournalEntry(entryId) {
        if (!adminOnly()) return;
        const entry = state.entries.find((item) => item.id === entryId);
        if (!entry) return;
        reverseEntry(entryId);
        state.logs.unshift({ time: new Date().toISOString(), user: state.company.role, action: `Voided ${entry.ref}` });
        saveState();
        render();
      }

      function renderModal(title, body, actions) {
        const actionButtons = actions.map((action) => `
          <button class="${action.className}" data-modal-action="${action.action}">${action.label}</button>
        `).join('');

        $('#modal-root').innerHTML = `
          <div class="modal-overlay" onclick="if (event.target === this) closeModal();">
            <div class="modal-card" role="dialog" aria-modal="true">
              <h3>${escapeHtml(title)}</h3>
              <div style="margin-top: 16px;">${body}</div>
              <div class="modal-actions">${actionButtons}</div>
            </div>
          </div>
        `;
      }

      function closeModal() {
        $('#modal-root').innerHTML = '';
        modalState = null;
      }

      function exportAllData() {
        const rows = [
          ['Type', 'No', 'Date', 'Contact', 'Description', 'Amount'],
          ...state.docs.map((doc) => ['Document', doc.no, doc.date, doc.contact, doc.description, doc.total]),
          ...state.entries.map((entry) => ['Entry', entry.ref, entry.date, '', entry.memo, entry.lines.reduce((sum, line) => sum + Number(line.debit || 0), 0)])
        ];

        const sheet = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, sheet, 'Ledger');
        XLSX.writeFile(wb, `LedgerPro_${todayIso()}.xlsx`);
      }

      function exportReport() {
        const rows = [[ 'Account', 'Type', 'Balance' ], ...sortedAccounts().filter((account) => account.active).map((account) => [account.name, account.type, balanceForAccount(account.id)])];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Report');
        XLSX.writeFile(wb, `LedgerPro_Report_${todayIso()}.xlsx`);
      }

      function backupJson() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `LedgerPro_backup_${todayIso()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function wipeData() {
        if (!adminOnly()) return;
        const confirmed = confirm('This will erase all books on this device. Continue?');
        if (!confirmed) return;
        state = defaultState();
        saveState();
        render();
      }

      function importExcel() {
        if (!adminOnly()) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx,.xls,.csv';
        input.addEventListener('change', async (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const workbook = XLSX.read(await file.arrayBuffer(), { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { raw: false });

          let imported = 0;
          for (const row of rows) {
            const date = row.Date || row.date || row['Date'];
            const ref = row.Ref || row.ref || row['Ref'] || `IMP-${imported + 1}`;
            const memo = row.Description || row.description || row['Description'] || '';
            const accountName = row.Account || row.account || row['Account'];
            const amount = Number(row.Debit || row.debit || 0) || Number(row.Credit || row.credit || 0) || 0;
            const account = findAccountByCode(Number(String(accountName).split(' ')[0])) || state.accounts.find((item) => item.name.toLowerCase() === String(accountName).toLowerCase());
            if (!date || !account || !amount) continue;

            const debit = Number(row.Debit || row.debit || 0) || 0;
            const credit = Number(row.Credit || row.credit || 0) || 0;
            const entry = postEntry(date, ref, memo, [{ accountId: account.id, debit, credit }], 'import');
            if (entry) imported += 1;
          }
          showToast(`${imported} entries imported`);
          render();
        });
        input.click();
      }

      function render() {
        renderSidebar();
        renderMain();
      }

      document.addEventListener('click', (event) => {
        const navButton = event.target.closest('[data-nav]');
        if (navButton) {
          currentView = navButton.dataset.nav;
          searchQuery = '';
          render();
          return;
        }

        const modalAction = event.target.closest('[data-modal-action]');
        if (modalAction) {
          const action = modalAction.dataset.modalAction;
          if (action === 'closeModal') closeModal();
          else if (action === 'saveAccount') saveAccount();
          else if (action === 'saveDocument') saveDocument();
          else if (action === 'saveJournalEntry') saveJournalEntry();
        }
      });

      render();
    </script>
    <script src="./supabase-bridge.js"></script>
  </body>
</html>
